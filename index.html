<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="countlife128.png" type="image/png" />
    <title>CountLife</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Settings Icon -->
    <div class="settings" id="settingsIcon" title="Settings" aria-label="Open Settings">
      ☰
    </div>

    <!-- Draggable 1:1 Tilted Photo Frame -->
    <div id="userPhotoFrame" class="photo-frame" style="display: none;" title="Drag me anywhere!">
      <div class="photo-inner">
        <img id="userPhotoImg" alt="Motivation Photo" />
      </div>
    </div>

    <!-- Centered Content Container -->
    <div class="centered-content">
      <div class="message">
        Stop wasting time, it's ticking out of your hand
      </div>
      <div id="countdownTitle" class="countdown-title">CountLife</div>
      <div id="countdown" class="countdown">
        <div class="time-unit">
          <span id="years">00</span>
          <p>YEARS</p>
        </div>
        <div class="time-unit">
          <span id="months">00</span>
          <p>MONTHS</p>
        </div>
        <div class="time-unit">
          <span id="days">00</span>
          <p>DAYS</p>
        </div>
        <div class="time-unit">
          <span id="hours">00</span>
          <p>HOURS</p>
        </div>
        <div class="time-unit">
          <span id="minutes">00</span>
          <p>MINUTES</p>
        </div>
        <div class="time-unit">
          <span id="seconds">00</span>
          <p>SECONDS</p>
        </div>
        <div class="time-unit">
          <span id="milliseconds">000</span>
          <p>MS</p>
        </div>
      </div>
    </div>

    <!-- GitHub-style Grid Covering Full Page -->
    <div class="grid" id="gridContainer"></div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
      <div class="modal-content">
        <span class="modal-close" id="modalClose" title="Close">✕</span>
        <h2>Set Countdown</h2>
        <p>Select either your lifespan or a specific event deadline.</p>

        <!-- Tabbed Interface for Options -->
        <div class="tab">
          <button id="tabLifespan" class="tablinks active" type="button">
            Lifespan Countdown
          </button>
          <button id="tabEvent" class="tablinks" type="button">
            Event Deadline
          </button>
        </div>

        <!-- Lifespan Input -->
        <div id="Lifespan" class="tabcontent" style="display: block;">
          <label for="dobInput">Enter your Date of Birth:</label>
          <input type="date" id="dobInput" required />

          <!-- Photo Upload Section (1:1 Ratio, Max 10MB) - Lifespan only -->
          <div class="photo-section">
            <label for="photoInput">Personal Motivation Photo:</label>
            <input type="file" id="photoInput" accept="image/*" />
            <p class="photo-note">Upload 1 photo (Max: 10 MB, stored locally)</p>
            <button id="removePhotoBtn" type="button" style="display: none;">Remove Photo</button>
          </div>
        </div>

        <!-- Event Deadline Inputs -->
        <div id="Event" class="tabcontent" style="display: none;">
          <label for="eventTitle">Event Title:</label>
          <input
            type="text"
            id="eventTitle"
            placeholder="Enter event title"
          />

          <label for="startDate">Start Date:</label>
          <input type="date" id="startDate" />

          <label for="endDate">End Date:</label>
          <input type="date" id="endDate" />
        </div>

        <p id="errorMessage" style="color: red; display: none;">
          Please fill in all fields.
        </p>
        <button id="saveSettings" type="button">Start Countdown</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
